<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECEEF1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mes couvertures">
<link rel="apple-touch-icon" href="icon.png">
<title>Mes couvertures</title>
<style>
:root{
  /* Charte neutre, ni AXA ni Macif */
  --bg:#ECEEF1;
  --surface:#FFFFFF;
  --surface-2:#F6F7F9;
  --ink:#1C2126;
  --muted:#5E6873;
  --faint:#8A929C;
  --line:#DCE0E5;
  --line-strong:#C7CDD4;
  --accent:#2A6F6B;       /* teal sobre, distinct des deux assureurs */
  --accent-ink:#1E5450;

  /* Niveaux de verdict (sémaphore fonctionnel, indépendant des marques) */
  --green:#1F7A4D;   --green-bg:#E7F4EC;   --green-line:#BFE3CC;
  --orange:#A96A12;  --orange-bg:#FBF1DE;  --orange-line:#EAD4A6;
  --red:#B03636;     --red-bg:#FAE9E9;     --red-line:#ECC4C4;
  --blue:#2C5C8A;    --blue-bg:#E8F0F8;    --blue-line:#C3D6EA;

  --radius:14px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(28,33,38,.06), 0 6px 18px rgba(28,33,38,.06);
  --pad:18px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* Cadre mobile-first, ~480px max */
.shell{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
}

/* En-tete */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(236,238,241,.92);
  -webkit-backdrop-filter:saturate(140%) blur(8px);
  backdrop-filter:saturate(140%) blur(8px);
  border-bottom:1px solid var(--line);
  padding:14px var(--pad) 12px;
}
.head-row{display:flex;align-items:center;gap:12px;min-height:32px}
.eyebrow{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent-ink);font-weight:600;
}
.wordmark{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.1}
.back{
  appearance:none;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink);border-radius:999px;height:34px;padding:0 14px 0 10px;
  font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;
}
.back:hover{background:var(--surface-2)}
.home-btn{
  margin-left:auto;
  appearance:none;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink);border-radius:999px;height:34px;padding:0 14px;
  font-size:14px;font-weight:600;cursor:pointer;flex:none;
}
.home-btn:hover{background:var(--surface-2)}
.crumb{font-size:12px;color:var(--muted);margin-top:6px;min-height:16px}

/* Contenu */
main{flex:1;padding:var(--pad);display:flex;flex-direction:column;gap:14px}
.lead{color:var(--muted);font-size:15px;margin:2px 0 6px}
.cat-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);font-weight:700;margin:14px 2px 2px}
.cat-h:first-child{margin-top:2px}

/* Cartes cliquables (liste contrats, univers, cas, situations) */
.tile{
  width:100%;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start;
  transition:border-color .12s ease, transform .04s ease;
}
.tile:hover{border-color:var(--line-strong)}
.tile:active{transform:translateY(1px)}
.tile-body{flex:1;min-width:0}
.tile-title{font-weight:650;font-size:16px;letter-spacing:-.01em}
.tile-sub{color:var(--muted);font-size:13px;margin-top:3px}
.chev{color:var(--faint);font-size:20px;line-height:1;margin-top:1px}

/* Etiquettes */
.pill{
  display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;
  padding:3px 9px;border-radius:999px;background:var(--surface-2);
  color:var(--muted);border:1px solid var(--line);
}
.pill.assureur{background:#EEF3F2;border-color:#D5E2E0;color:var(--accent-ink)}
.pill.urgent{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
.pill.demo{background:#F0ECF6;border-color:#DCD2EC;color:#5A4B86}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* Section choix de mode (accueil) */
.mode{display:flex;flex-direction:column;gap:6px}
.mode .tile-title{font-size:17px}

/* Diagnostic, questions */
.q-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px}
.q-step{font-size:12px;color:var(--faint);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.q-title{font-weight:650;font-size:17px;margin:8px 0 14px;letter-spacing:-.01em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  appearance:none;text-align:left;cursor:pointer;
  border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius-sm);
  padding:13px 14px;font-size:15px;font-weight:550;color:var(--ink);
}
.opt:hover{border-color:var(--accent);background:#F4FAF9}
.opt.sel{border-color:var(--accent);background:#EAF5F3;box-shadow:inset 0 0 0 1px var(--accent)}

/* Verdict */
.verdict{border-radius:var(--radius);padding:16px 16px 14px;border:1px solid}
.verdict.green{background:var(--green-bg);border-color:var(--green-line)}
.verdict.orange{background:var(--orange-bg);border-color:var(--orange-line)}
.verdict.red{background:var(--red-bg);border-color:var(--red-line)}
.verdict.blue{background:var(--blue-bg);border-color:var(--blue-line)}
.v-flag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.verdict.green .v-flag{color:var(--green)}
.verdict.orange .v-flag{color:var(--orange)}
.verdict.red .v-flag{color:var(--red)}
.verdict.blue .v-flag{color:var(--blue)}
.v-title{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:6px 0 0}
.v-sub{font-size:14px;color:#3a4149;margin-top:6px}

/* Blocs detail (couvert, exclu, actions, montants, source) */
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:14px 16px}
.block h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.block ul{margin:0;padding-left:18px}
.block li{margin:4px 0;font-size:14.5px}
.block.cov h3{color:var(--green)}
.block.excl h3{color:var(--red)}
.block.actions h3{color:var(--blue)}
.note{font-size:13.5px;color:var(--muted);font-style:normal}
.formula{display:inline-block;font-size:13px;background:var(--surface-2);border:1px dashed var(--line-strong);
  border-radius:6px;padding:2px 7px;color:var(--accent-ink)}
.src{font-size:12.5px;color:var(--faint)}
.src .mono{color:var(--muted)}
.highlight{background:#EAF5F3;border:1px solid #C7E4DF;border-radius:var(--radius-sm);padding:13px 15px}
.hl-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.hl-value{font-size:18px;font-weight:700;letter-spacing:-.01em;margin-top:3px;color:var(--ink)}
.block li .amt{color:var(--accent-ink);font-weight:600}

/* Couche situation, garanties par contrat */
.garantie{border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;background:var(--surface)}
.garantie + .garantie{margin-top:8px}
.g-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.g-contrat{font-weight:650;font-size:14px}
.nature{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid}
.nature.forfaitaire{background:#EAF5F3;border-color:#C7E4DF;color:var(--accent-ink)}
.nature.indemnitaire{background:#FBF1DE;border-color:#EAD4A6;color:var(--orange)}
.nature.mixte{background:#F0ECF6;border-color:#DCD2EC;color:#5A4B86}
.g-line{font-size:13.5px;color:#3a4149;margin-top:6px}
.g-meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:10px}
.trou{background:var(--red-bg);border:1px solid var(--red-line);border-radius:var(--radius-sm);
  padding:12px 14px;font-size:13.5px}
.trou b{color:var(--red)}

/* Etat vide */
.empty{text-align:center;color:var(--muted);font-size:14px;padding:26px 10px;
  border:1px dashed var(--line-strong);border-radius:var(--radius);background:var(--surface-2)}

/* Pied, zone construction */
footer{padding:16px var(--pad) 26px;border-top:1px solid var(--line);margin-top:6px}
.foot-line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.foot-meta{font-size:12px;color:var(--faint)}
.btn-sec{
  appearance:none;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink);border-radius:999px;height:34px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer;
}
.btn-sec:hover{background:var(--surface-2)}
.report{margin-top:12px;font-size:13px;border-radius:var(--radius-sm);padding:12px 14px;border:1px solid}
.report.ok{background:var(--green-bg);border-color:var(--green-line);color:var(--green)}
.report.ko{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
.report ul{margin:8px 0 0;padding-left:18px}
.report li{color:#3a4149}

a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="head-row">
      <button class="back" id="backBtn" hidden>‹ Retour</button>
      <div>
        <div class="eyebrow">Copilote personnel</div>
        <h1 class="wordmark">Mes couvertures</h1>
      </div>
      <button class="home-btn" id="homeBtn" hidden>Accueil</button>
    </div>
    <div class="crumb" id="crumb"></div>
  </header>

  <main id="app" aria-live="polite"></main>

  <footer>
    <div class="foot-line">
      <span class="foot-meta" id="footMeta"></span>
      <button class="btn-sec" id="selfTestBtn">Contrôle structurel</button>
    </div>
    <div id="report"></div>
  </footer>
</div>

<script>
/* ============================================================
   MES COUVERTURES, moteur unifié (Phase 1)
   Modèle à deux entités: CONTRATS et SITUATIONS.
   Aucun appel réseau. Aucun montant inventé.
   ============================================================ */

var BUILD = 'Phase 7, audit qualité et anti-IA';
var SHOW_DEMO = false; /* contrat de démonstration retiré, univers GAV en place */

/* ---- Niveaux de verdict autorisés ---- */
var LVL = ['green','orange','red','blue'];
var LVL_FLAG = {green:'Couvert', orange:'Sous conditions', red:'Exclu', blue:'Information'};

/* ---- Natures de garantie autorisées (couche d’articulation) ---- */
var NATURES = ['forfaitaire','indemnitaire','mixte'];

/* ============================================================
   ENTITÉ 1, CONTRATS
   contrat = { id, nom, assureur, version, ref, type, demo?,
               univers:[ { id, label, cases:[ CAS ] } ] }
   CAS    = { id, title, pill?, urgent?, intro?, nature?,
              quals:[ { id, t, opt:[string] } ],
              diag:function(a){ return { lvl, t, sub? } },
              highlight?, cov?:[string], excl?:[string],
              actions?:[string], note?, prov?:[string], src }
   prov  = montants laissés en formule tant que les conditions
           particulières ne sont pas fournies.
   ============================================================ */
var CONTRATS = [
  {
    id:'gav', nom:'Garantie Accident (GAV)', assureur:'Macif',
    version:'avril 2021', ref:'PREI/ACC/05 - 04/21 - N754',
    type:'mixte',
    univers:[
      {
        id:'gav-acc', label:'Garantie Accident',
        cases:[

          {
            id:'gav-1',
            title:'Suis-je couvert après un accident ?',
            pill:'Périmètre',
            intro:'La GAV couvre les accidents de la vie privée, de trajet et de la circulation, sous une condition d’âge.',
            quals:[
              {id:'nature', t:'Quelle est la nature de l’accident ?', opt:['Vie privée','Trajet domicile-travail','Accident de la circulation']},
              {id:'age', t:'Quel âge a la personne accidentée ?', opt:['Moins de 75 ans','75 ans ou plus']}
            ],
            diag:function(a){
              if(a.age==='Moins de 75 ans') return {lvl:'green', t:'Accident couvert', sub:'Avant 75 ans, la garantie joue pour la vie privée, le trajet et la circulation.'};
              if(a.nature==='Accident de la circulation') return {lvl:'orange', t:'Couverture maintenue sous condition', sub:'Au-delà de 75 ans, seul l’accident de circulation comme conducteur d’un véhicule terrestre à moteur reste couvert. Vérifiez cette qualité.'};
              return {lvl:'red', t:'Accident non couvert au-delà de 75 ans', sub:'Passé 75 ans, la vie privée et le trajet ne sont plus couverts. Seul l’accident de circulation comme conducteur l’est.'};
            },
            cov:['Accidents de la vie privée','Accidents de trajet domicile-travail','Accidents de la circulation'],
            excl:['Au-delà de 75 ans, vie privée et trajet exclus, seul l’accident de circulation comme conducteur reste couvert'],
            note:'Sous alcool ou stupéfiants, l’invalidité est exclue (art 10 B).',
            src:'CG GAV Macif 2021'
          },

          {
            id:'gav-2',
            title:'Quelles séquelles sont indemnisées ?',
            pill:'Invalidité',
            intro:'L’invalidité est indemnisée à partir d’un seuil, sous forme de capital ou de rente, avec déduction des prestations Sécurité sociale.',
            nature:'indemnitaire',
            quals:[
              {id:'taux', t:'Quel taux d’incapacité permanente est retenu ?', opt:['Moins de 10 %','Entre 10 % et 49 %','50 % ou plus']},
              {id:'origine', t:'Quelle est l’origine de l’accident ?', opt:['Vie privée','Circulation comme conducteur']}
            ],
            diag:function(a){
              if(a.taux==='Moins de 10 %') return {lvl:'red', t:'Pas d’indemnisation de l’invalidité', sub:'En dessous de 10 % d’incapacité permanente, le poste invalidité n’est pas indemnisé.'};
              var poste = (a.taux==='50 % ou plus') ? 'Rente d’invalidité' : 'Capital constitutif';
              var plancher = (a.origine==='Vie privée') ? ' Plancher garanti de 50 % de la rente pour un accident de la vie privée.' : '';
              return {lvl:'orange', t:poste+' versé', sub:'Indemnisation partiellement indemnitaire, déduction des prestations Sécurité sociale (art 7).'+plancher};
            },
            cov:['Taux d’au moins 10 %: capital constitutif si le taux est inférieur à 50 %, rente au-delà','Dépendance totale: prestation supplémentaire si l’option le prévoit'],
            excl:['Taux d’incapacité inférieur à 10 %'],
            prov:[
              'Capital ou rente exprimés en U.C. Valeur de l’U.C. et coefficient à lire aux conditions particulières.',
              'Dépendance totale: +40 U.C. si l’option souscrite est au moins « essentielle ».',
              'Déduction des indemnités Sécurité sociale (art 7). Plancher de 50 % de la rente pour un accident de la vie privée.'
            ],
            note:'Sous alcool ou stupéfiants, l’invalidité est exclue (art 10 B).',
            src:'CG GAV Macif 2021, art 7'
          },

          {
            id:'gav-3',
            title:'Décès accidentel, que verse le contrat ?',
            pill:'Décès',
            intro:'Le décès accidentel ouvre des prestations forfaitaires, cumulables avec vos autres contrats.',
            nature:'forfaitaire',
            quals:[
              {id:'prestation', t:'Quelle prestation souhaitez-vous vérifier ?', opt:['Capital au conjoint','Rente éducation des enfants','Frais d’obsèques']}
            ],
            diag:function(a){
              return {lvl:'green', t:'Décès accidentel pris en charge', sub:'Prestation visée: '+a.prestation+'. Versement forfaitaire, cumulable avec d’autres contrats.'};
            },
            cov:['Capital au conjoint','Rente éducation par enfant, avec majoration et capital orphelin','Frais d’obsèques'],
            prov:[
              'Capital conjoint: minimum 10 U.C. × coefficient.',
              'Rente éducation: 2 U.C. × coefficient par enfant. Majoration orphelin 5 U.C. et capital orphelin 20 U.C.',
              'Frais d’obsèques: 5 ou 10 U.C. selon le cas. Valeur de l’U.C. aux conditions particulières.'
            ],
            note:'Prestations forfaitaires, donc cumulables avec un autre contrat de personnes.',
            src:'CG GAV Macif 2021'
          },

          {
            id:'gav-4',
            title:'Qui est assuré ?',
            pill:'Assurés',
            intro:'Le contrat famille couvre le souscripteur et son foyer, selon des catégories précises.',
            quals:[
              {id:'qui', t:'De qui s’agit-il ?', opt:['Moi, souscripteur','Conjoint, concubin ou PACS','Enfant mineur','Enfant de moins de 25 ans en études','Enfant handicapé à charge','Autre personne']}
            ],
            diag:function(a){
              if(a.qui==='Autre personne') return {lvl:'red', t:'Personne non assurée', sub:'Cette personne ne figure pas parmi les assurés du contrat famille.'};
              return {lvl:'green', t:'Personne assurée', sub:a.qui+' relève des assurés du contrat famille.'};
            },
            cov:['Souscripteur','Conjoint, concubin ou partenaire de PACS','Enfants mineurs','Enfants de moins de 25 ans en études','Enfants handicapés à charge'],
            src:'CG GAV Macif 2021'
          },

          {
            id:'gav-5',
            title:'Accident loin du domicile ou à l’étranger',
            pill:'Assistance',
            urgent:true,
            intro:'L’assistance couvre les frais médicaux, le rapatriement et la recherche et secours, dans le monde entier.',
            quals:[
              {id:'lieu', t:'Où l’accident a-t-il eu lieu ?', opt:['En France','À l’étranger']},
              {id:'besoin', t:'De quoi avez-vous besoin ?', opt:['Frais médicaux','Rapatriement','Recherche et secours']}
            ],
            diag:function(a){
              var terr = (a.lieu==='À l’étranger') ? ' Couverture monde entier, séjour de moins d’un an.' : '';
              return {lvl:'green', t:'Assistance prise en charge', sub:'Besoin: '+a.besoin+'.'+terr};
            },
            cov:['Frais médicaux à l’étranger jusqu’à 80 000 EUR','Recherche et secours jusqu’à 8 000 EUR','Rapatriement organisé et pris en charge'],
            actions:['Contacter l’assistance avant d’engager les frais','Conserver tous les justificatifs médicaux'],
            note:'Territorialité: monde entier, pour un séjour de moins d’un an.',
            src:'CG GAV Macif 2021'
          },

          {
            id:'gav-6',
            title:'Aide à domicile après un accident',
            pill:'Services',
            intro:'Après un accident, des services d’aide à domicile peuvent être déclenchés.',
            quals:[
              {id:'besoin', t:'Quel besoin ?', opt:['Aide-ménagère','Garde des enfants','Venue d’un proche']}
            ],
            diag:function(a){
              return {lvl:'green', t:'Service d’aide pris en charge', sub:'Besoin: '+a.besoin+'.'};
            },
            cov:['Aide-ménagère, 30 heures sur 30 jours','Garde des enfants','Déplacement d’un proche, 92 EUR'],
            src:'CG GAV Macif 2021'
          },

          {
            id:'gav-7',
            title:'Soutien psychologique',
            pill:'Services',
            intro:'Un soutien psychologique peut être pris en charge à la suite d’un accident grave ou d’un décès.',
            quals:[],
            diag:function(a){
              return {lvl:'green', t:'Soutien psychologique pris en charge', sub:'Jusqu’à 3 consultations.'};
            },
            cov:['Jusqu’à 3 consultations de soutien psychologique'],
            src:'CG GAV Macif 2021'
          },

          {
            id:'gav-8',
            title:'Enfant scolarisé blessé',
            pill:'Nouveauté 2021',
            intro:'La version 2021 ajoute une garantie dédiée aux assurés scolarisés.',
            nature:'mixte',
            quals:[
              {id:'besoin', t:'Quel est le besoin ?', opt:['Frais de soins et prothèses','Invalidité grave d’au moins 80 %','Décès']}
            ],
            diag:function(a){
              if(a.besoin==='Frais de soins et prothèses') return {lvl:'orange', t:'Frais de soins pris en charge', sub:'Frais restés à charge remboursés, prestation indemnitaire.'};
              if(a.besoin==='Décès') return {lvl:'green', t:'Frais d’obsèques pris en charge', sub:'Capital forfaitaire dédié à l’enfant scolarisé.'};
              return {lvl:'green', t:'Invalidité grave prise en charge', sub:'Aménagement du logement et capital autonomie, prestations forfaitaires.'};
            },
            cov:['Frais de soins réels et prothèses, 77 / 39 / 305 / 305 / 610 EUR selon le type','Invalidité d’au moins 80 %: aménagement du logement 15 245 EUR, capital autonomie 76 225 EUR','Frais d’obsèques de l’enfant scolarisé 4 574 EUR'],
            note:'Garantie introduite en 2021. Les frais de soins sont indemnitaires (frais restés à charge), le capital autonomie est forfaitaire.',
            src:'CG GAV Macif 2021, art 9'
          },

          {
            id:'gav-9',
            title:'Proche aidant en perte d’autonomie',
            pill:'Nouveauté 2021',
            intro:'La version 2021 prévoit un accompagnement de l’aidant d’un proche en perte d’autonomie.',
            quals:[
              {id:'service', t:'Quel service ?', opt:['Accompagnement administratif et psychologique','Solution de répit','Maintien à domicile']}
            ],
            diag:function(a){
              return {lvl:'green', t:'Accompagnement de l’aidant pris en charge', sub:'Service visé: '+a.service+'.'};
            },
            cov:['Accompagnement administratif et psychologique','Solution de répit pour l’aidant','Maintien à domicile','Déplacement 200 EUR','Prestation de nettoyage 500 EUR'],
            note:'Garantie introduite en 2021.',
            src:'CG GAV Macif 2021, art 11 D'
          },

/* ============================================================
   ÉTAT ET DISPATCHER
   step: accueil | contrats | univers | cas | diag | situations | situ
   ============================================================ */
var S = {step:'accueil', mode:null, dom:null, fromEvent:false, contratId:null, fam:null, casId:null, answers:{}, qIdx:0, situId:null};

function allContrats(){ return SHOW_DEMO ? CONTRATS.concat([CONTRAT_DEMO]) : CONTRATS; }
function getContrat(id){ return allContrats().filter(function(c){return c.id===id;})[0] || null; }
function getUnivers(c,id){ return (c?c.univers:[]).filter(function(u){return u.id===id;})[0] || null; }
function getCas(u,id){ return (u?u.cases:[]).filter(function(k){return k.id===id;})[0] || null; }
function getSitu(id){ return SITUATIONS.filter(function(s){return s.id===id;})[0] || null; }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];}); }

/* ---- Rendu ---- */
function render(){
  var app = document.getElementById('app');
  var back = document.getElementById('backBtn');
  var homeBtn = document.getElementById('homeBtn');
  var crumb = document.getElementById('crumb');
  back.hidden = (S.step==='accueil');
  homeBtn.hidden = (S.step==='accueil');
  crumb.textContent = breadcrumb();
  var html = '';
  switch(S.step){
    case 'accueil':    html = viewAccueil(); break;
    case 'domaine':    html = viewDomaine(); break;
    case 'contrats':   html = viewContrats(); break;
    case 'univers':    html = viewUnivers(); break;
    case 'cas':        html = viewCas(); break;
    case 'diag':       html = viewDiag(); break;
    case 'situations': html = viewSituations(); break;
    case 'situ':       html = viewSitu(); break;
    default:           html = viewAccueil();
  }
  app.innerHTML = html;
  app.scrollTop = 0;
  window.scrollTo(0,0);
}

function breadcrumb(){
  if(S.step==='accueil') return '';
  if(S.step==='domaine') return S.dom||'';
  var parts = [];
  if(S.fromEvent && S.dom){
    parts.push(S.dom);
    if(S.mode==='situation'){ var sg=getSitu(S.situId); if(sg) parts.push(sg.title); }
    else { var kg=getCas(getUnivers(getContrat(S.contratId),S.fam),S.casId); if(kg) parts.push(kg.title); }
    return parts.join('  ›  ');
  }
  var c = getContrat(S.contratId);
  if(S.mode==='contrat'){
    parts.push('Mes contrats');
    if(c) parts.push(c.nom);
    var u = getUnivers(c, S.fam); if(u) parts.push(u.label);
    var k = getCas(u, S.casId); if(k) parts.push(k.title);
  } else if(S.mode==='situation'){
    parts.push('Mes situations');
    var s = getSitu(S.situId); if(s) parts.push(s.title);
  }
  return parts.join('  ›  ');
}

/* ---- Liste des univers d’un contrat ---- */
function viewUnivers(){
  var c = getContrat(S.contratId);
  if(!c) return emptyState('Contrat introuvable.');
  if(!c.univers.length){
    return refContrat(c)+emptyState('Cas en cours d’intégration pour ce contrat.');
  }
  var out = refContrat(c);
  c.univers.forEach(function(u){
    out += tile('u:'+u.id, u.label, u.cases.length+' cas', null);
  });
  return out;
}

/* ---- Liste des cas d’un univers ---- */
function viewCas(){
  var c = getContrat(S.contratId), u = getUnivers(c, S.fam);
  if(!u) return emptyState('Univers introuvable.');
  if(!u.cases.length) return emptyState('Aucun cas dans cet univers.');
  var out = refContrat(c);
  u.cases.forEach(function(k){
    var pills = (k.urgent?'<span class="pill urgent">urgent</span>':'')+(k.pill?'<span class="pill">'+esc(k.pill)+'</span>':'');
    out += tile('k:'+k.id, k.title, k.intro?clip(k.intro):'', pills);
  });
  return out;
}

/* ---- Diagnostic d’un cas, qualification puis verdict ---- */
/* Cas carte dont la notice conditionne la garantie à un paiement avec la carte. */
var GATE_PAIEMENT = ['vy_annulation','vy_interruption','lo_franchise','lo_assurance','lo_vehicules','sk_chute','sk_materiel','sk_forfait'];
function isGatedCard(){ return S.contratId==='visa' && GATE_PAIEMENT.indexOf(S.casId)>=0; }

function viewDiag(){
  var c = getContrat(S.contratId), u = getUnivers(c, S.fam), k = getCas(u, S.casId);
  if(!k) return emptyState('Cas introuvable.');
  /* Porte d'éligibilité, paiement avec la carte */
  if(isGatedCard()){
    if(!S.answers.hasOwnProperty('_paye')){
      return ''+
        '<div class="q-card">'+
          '<div class="q-step">Condition d’éligibilité</div>'+
          '<div class="q-title">La prestation a-t-elle été réglée avec la carte Visa Premier ?</div>'+
          '<p class="note" style="margin:0 0 14px">Cette garantie suppose un règlement, total ou partiel, avec la carte. Elle concerne le porteur, son conjoint et ses enfants à charge.</p>'+
          '<div class="opts">'+
            '<button class="opt" data-act="gate" data-val="Oui">Oui, réglé avec la carte</button>'+
            '<button class="opt" data-act="gate" data-val="Non">Non</button>'+
          '</div>'+
        '</div>';
    }
    if(S.answers._paye==='Non'){
      return renderVerdict(k, {lvl:'red', t:'Garantie non acquise', sub:'Cette garantie de la carte Visa Premier suppose un règlement, total ou partiel, avec la carte.'});
    }
  }
  var quals = k.quals||[];
  /* Qualification sequentielle */
  if(S.qIdx < quals.length){
    var q = quals[S.qIdx];
    var opts = (q.opt||[]).map(function(o){
      var sel = (S.answers[q.id]===o)?' sel':'';
      return '<button class="opt'+sel+'" data-act="ans" data-qid="'+esc(q.id)+'" data-val="'+esc(o)+'">'+esc(o)+'</button>';
    }).join('');
    return ''+
      (k.intro?'<p class="lead">'+esc(k.intro)+'</p>':'')+
      '<div class="q-card">'+
        '<div class="q-step">Question '+(S.qIdx+1)+' sur '+quals.length+'</div>'+
        '<div class="q-title">'+esc(q.t)+'</div>'+
        '<div class="opts">'+opts+'</div>'+
      '</div>';
  }
  /* Verdict */
  var v = safeDiag(k, S.answers);
  return renderVerdict(k, v);
}

function renderVerdict(k, v){
  var lvl = (LVL.indexOf(v.lvl)>=0)?v.lvl:'blue';
  var out = (k.intro?'<p class="lead">'+esc(k.intro)+'</p>':'')+
    '<div class="verdict '+lvl+'">'+
      '<div class="v-flag">'+esc(LVL_FLAG[lvl])+'</div>'+
      '<div class="v-title">'+esc(v.t||'')+'</div>'+
      (v.sub?'<div class="v-sub">'+esc(v.sub)+'</div>':'')+
    '</div>';
  if(k.highlight){
    if(typeof k.highlight==='object'){
      out += '<div class="highlight"><div class="hl-label">'+esc(k.highlight.label||'')+'</div><div class="hl-value">'+esc(k.highlight.value||'')+'</div></div>';
    } else {
      out += '<div class="block"><div class="note">'+esc(k.highlight)+'</div></div>';
    }
  }
  out += listBlock('cov','Ce qui est couvert', k.cov);
  out += listBlock('excl','Ce qui reste exclu', k.excl);
  out += listBlock('actions','Quoi faire', k.actions);
  if(k.prov && k.prov.length){
    out += '<div class="block"><h3>Montants</h3>'+
      k.prov.map(function(p){return '<div><span class="formula">'+esc(p)+'</span></div>';}).join('')+'</div>';
  }
  if(k.note) out += '<div class="block"><div class="note">'+esc(k.note)+'</div></div>';
  out += '<div class="block"><h3>Source</h3><div class="src mono">'+esc(k.src||'à compléter')+'</div></div>';
  out += '<div style="display:flex;gap:8px;margin-top:4px"><button class="btn-sec" data-act="restart">Recommencer</button><button class="btn-sec" data-act="home">Accueil</button></div>';
  return out;
}

/* ---- Liste des situations ---- */
function viewSituations(){
  var out = '<p class="lead">Choisissez une situation. La réponse arbitre entre vos contrats.</p>';
  if(!SITUATIONS.length) return out+emptyState('Aucune situation. La couche d’articulation s’ouvre en Phase 6.');
  SITUATIONS.forEach(function(s){
    var pills = (s.urgent?'<span class="pill urgent">urgent</span>':'')+(s.pill?'<span class="pill">'+esc(s.pill)+'</span>':'');
    out += tile('s:'+s.id, s.title, s.intro?clip(s.intro):'', pills);
  });
  return out;
}

/* ---- Détail d’une situation ---- */
function viewSitu(){
  var s = getSitu(S.situId);
  if(!s) return emptyState('Situation introuvable.');
  var out = '';
  if(s.intro) out += '<p class="lead">'+esc(s.intro)+'</p>';
  (s.garanties||[]).forEach(function(g){
    var c = getContrat(g.contratId);
    var contratLbl = c ? (c.nom+', '+c.assureur) : ('contrat '+g.contratId);
    var nat = (NATURES.indexOf(g.nature)>=0)?g.nature:'mixte';
    var meta = [];
    if(g.plafond) meta.push('Plafond, '+esc(g.plafond));
    if(g.franchise) meta.push('Franchise, '+esc(g.franchise));
    if(g.territorialite) meta.push('Territoire, '+esc(g.territorialite));
    if(g.ordre!=null) meta.push('Ordre, '+esc(g.ordre));
    out += '<div class="garantie">'+
      '<div class="g-head">'+
        '<span class="g-contrat">'+esc(contratLbl)+'</span>'+
        '<span class="nature '+nat+'">'+nat+'</span>'+
      '</div>'+
      '<div class="g-line">'+esc(g.garantie)+'</div>'+
      (g.note?'<div class="g-line note">'+esc(g.note)+'</div>':'')+
      (meta.length?'<div class="g-meta">'+meta.map(function(m){return '<span>'+m+'</span>';}).join('')+'</div>':'')+
      '<div class="src mono" style="margin-top:6px">'+esc(g.src||'')+'</div>'+
    '</div>';
  });
  if(s.logique) out += '<div class="block"><h3>Logique d’articulation</h3><div class="g-line">'+esc(s.logique)+'</div></div>';
  if(s.doublon) out += '<div class="block"><h3>Double emploi</h3><div class="g-line">'+esc(s.doublon)+'</div></div>';
  if(s.trou) out += '<div class="trou"><b>Trou de garantie. </b>'+esc(s.trou)+'</div>';
  out += '<div class="block"><h3>Source</h3><div class="src mono">'+esc(s.src||'')+'</div></div>';
  return out;
}

function listBlock(cls, titre, arr){
  if(!arr || !arr.length) return '';
  return '<div class="block '+cls+'"><h3>'+esc(titre)+'</h3><ul>'+
    arr.map(function(x){

function emptyState(msg){ return '<div class="empty">'+esc(msg)+'</div>'; }
function clip(t){ t=String(t); return t.length>90?t.slice(0,88)+'…':t; }

function safeDiag(k, a){
  try{
    var v = k.diag ? k.diag(a) : null;
    if(!v || typeof v!=='object' || !v.lvl || LVL.indexOf(v.lvl)<0) return {lvl:'blue', t:'Verdict indisponible', sub:'La fonction diag n’a pas renvoyé de niveau valide.'};
    return v;
  }catch(e){
    return {lvl:'blue', t:'Erreur de diagnostic', sub:String(e&&e.message||e)};
  }
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function go(act){
  if(act.indexOf('dom:')===0){ S.dom=act.slice(4); S.fromEvent=false; S.step='domaine'; return render(); }
  if(act.indexOf('ev:')===0){
    var ev = EVENTS[parseInt(act.slice(3),10)];
    if(!ev) return;
    S.fromEvent = true;
    if(ev.situation){ S.mode='situation'; S.situId=ev.situation; S.step='situ'; return render(); }
    var g = ev.goto || {};
    S.mode='contrat'; S.contratId=g.contrat;
    var c = getContrat(g.contrat), fam=null, theCas=null;
    (c?c.univers:[]).forEach(function(u){ u.cases.forEach(function(k){ if(k.id===g.cas){ fam=u.id; theCas=k; } }); });
    S.fam=fam; S.casId=g.cas;
    S.answers = g.answers ? JSON.parse(JSON.stringify(g.answers)) : {};
    var quals = (theCas && theCas.quals) ? theCas.quals : [];
    var qi = 0;
    while(qi<quals.length && S.answers.hasOwnProperty(quals[qi].id)) qi++;
    S.qIdx = qi;
    S.step='diag';
    return render();
  }
  if(act==='go-contrats'){ S.fromEvent=false; S.mode='contrat'; S.step='contrats'; return render(); }
  if(act==='go-situations'){ S.fromEvent=false; S.mode='situation'; S.step='situations'; return render(); }
  if(act.indexOf('c:')===0){
    S.contratId=act.slice(2);
    var c=getContrat(S.contratId);
    if(c && c.univers.length===1){ S.fam=c.univers[0].id; S.step='cas'; }
    else { S.step='univers'; }
    return render();
  }
  if(act.indexOf('u:')===0){ S.fam=act.slice(2); S.step='cas'; return render(); }
  if(act.indexOf('k:')===0){ S.casId=act.slice(2); S.answers={}; S.qIdx=0; S.step='diag'; return render(); }
  if(act.indexOf('s:')===0){ S.situId=act.slice(2); S.step='situ'; return render(); }
}
function back(){
  switch(S.step){
    case 'domaine':  S.step='accueil'; S.dom=null; break;
    case 'contrats': S.step='accueil'; S.mode=null; break;
    case 'univers':  S.step='contrats'; S.contratId=null; break;
    case 'cas':
      var cc=getContrat(S.contratId);
      if(cc && cc.univers.length===1){ S.step='contrats'; S.fam=null; S.contratId=null; }
      else { S.step='univers'; S.fam=null; }
      break;
    case 'diag':
      if(S.qIdx>0){ S.qIdx--; }
      else if(isGatedCard() && S.answers.hasOwnProperty('_paye')){ delete S.answers._paye; }
      else if(S.fromEvent){ S.step='domaine'; S.casId=null; S.answers={}; }
      else { S.step='cas'; S.casId=null; S.answers={}; }
      break;
    case 'situations': S.step='accueil'; S.mode=null; break;
    case 'situ':
      if(S.fromEvent){ S.step='domaine'; S.situId=null; }
      else { S.step='situations'; S.situId=null; }
      break;
    default: S.step='accueil';
  }
  render();
}
function answer(qid, val){
  S.answers[qid]=val;
  S.qIdx++;
  render();
}

/* ============================================================
   CONTRÔLE STRUCTUREL (gate Phase 1, intégré)
   Vérifie identifiants, schémas, verdicts valides, références
   résolues, natures autorisées, absence de doublon ou d’arbre mort.
   ============================================================ */
function cartesian(arrs){
  return arrs.reduce(function(acc, arr){
    var out=[];
    acc.forEach(function(a){ (arr.length?arr:[undefined]).forEach(function(v){ out.push(a.concat([v])); }); });
    return out;
  }, [[]]);
}
function selfTest(){
  var errors=[], counts={contrats:0, univers:0, cas:0, situations:0, garanties:0, combos:0};
  var seenContrat={}, contractIds={};
  var list = allContrats();

  list.forEach(function(c){
    counts.contrats++;
    if(!c.id) errors.push('Contrat sans id: '+(c.nom||'?'));
    if(seenContrat[c.id]) errors.push('Id de contrat en double: '+c.id);
    seenContrat[c.id]=true; contractIds[c.id]=true;
    ['nom','assureur','version','ref','type'].forEach(function(f){ if(!c[f]) errors.push('Contrat '+c.id+', champ manquant: '+f); });
    if(!Array.isArray(c.univers)) errors.push('Contrat '+c.id+', univers non tableau');
    var seenU={};
    (c.univers||[]).forEach(function(u){
      counts.univers++;
      if(!u.id) errors.push('Univers sans id dans '+c.id);
      if(seenU[u.id]) errors.push('Id univers en double dans '+c.id+': '+u.id);
      seenU[u.id]=true;
      if(!u.label) errors.push('Univers '+c.id+'/'+u.id+' sans label');
      if(!Array.isArray(u.cases)) errors.push('Univers '+c.id+'/'+u.id+', cases non tableau');
      var seenK={};
      (u.cases||[]).forEach(function(k){
        counts.cas++;
        if(!k.id) errors.push('Cas sans id dans '+c.id+'/'+u.id);
        if(seenK[k.id]) errors.push('Id cas en double dans '+c.id+'/'+u.id+': '+k.id);
        seenK[k.id]=true;
        if(!k.title) errors.push('Cas '+c.id+'/'+u.id+'/'+k.id+' sans titre');
        if(typeof k.diag!=='function'){ errors.push('Cas '+k.id+', diag non fonction'); return; }
        if(!k.src || /à compléter/i.test(k.src)) errors.push('Cas '+k.id+', source manquante');
        if(k.nature && NATURES.indexOf(k.nature)<0) errors.push('Cas '+k.id+', nature inconnue: '+k.nature);
        var quals=k.quals||[];
        var seenQ={};
        quals.forEach(function(q){
          if(!q.id) errors.push('Cas '+k.id+', question sans id');
          if(seenQ[q.id]) errors.push('Cas '+k.id+', id question en double: '+q.id);
          seenQ[q.id]=true;
          if(!q.t) errors.push('Cas '+k.id+'/'+q.id+', libellé manquant');
          if(!Array.isArray(q.opt) || !q.opt.length) errors.push('Cas '+k.id+'/'+q.id+', options manquantes');
        });
        /* Exhaustivité: chaque combinaison d’options renvoie un verdict valide */
        var combos = cartesian(quals.map(function(q){return q.opt||[];}));
        combos.forEach(function(combo){
          var a={};
          quals.forEach(function(q,i){ a[q.id]=combo[i]; });
          counts.combos++;
          var v;
          try{ v=k.diag(a); }catch(e){ errors.push('Cas '+k.id+', diag lève une erreur sur '+JSON.stringify(a)+': '+(e.message||e)); return; }
          if(!v || typeof v!=='object') errors.push('Cas '+k.id+', verdict non objet sur '+JSON.stringify(a));
          else{
            if(LVL.indexOf(v.lvl)<0) errors.push('Cas '+k.id+', niveau invalide ('+v.lvl+') sur '+JSON.stringify(a));
            if(!v.t) errors.push('Cas '+k.id+', verdict sans titre sur '+JSON.stringify(a));
          }
        });
      });
    });
  });

  var seenS={};
  SITUATIONS.forEach(function(s){
    counts.situations++;
    if(!s.id) errors.push('Situation sans id');
    if(seenS[s.id]) errors.push('Id situation en double: '+s.id);
    seenS[s.id]=true;
    if(!s.title) errors.push('Situation '+s.id+' sans titre');
    if(!Array.isArray(s.garanties) || !s.garanties.length) errors.push('Situation '+s.id+', garanties manquantes');
    (s.garanties||[]).forEach(function(g){
      counts.garanties++;
      if(!g.contratId || !contractIds[g.contratId]) errors.push('Situation '+s.id+', contrat non résolu: '+g.contratId);
      if(!g.garantie) errors.push('Situation '+s.id+', garantie sans libellé');
      if(NATURES.indexOf(g.nature)<0) errors.push('Situation '+s.id+', nature invalide: '+g.nature);
      if(!g.src) errors.push('Situation '+s.id+', source manquante');
    });
    if(!s.logique) errors.push('Situation '+s.id+', logique d’articulation manquante');
  });

  EVENTS.forEach(function(e,i){
    counts.events = (counts.events||0)+1;
    if(!e.label) errors.push('Événement '+i+' sans libellé');
    if(e.situation){
      if(!getSitu(e.situation)) errors.push('Événement '+i+', situation non résolue: '+e.situation);
      return;
    }
    var g = e.goto;
    if(!g || !g.contrat || !g.cas){ errors.push('Événement '+i+', cible incomplète'); return; }
    var c = getContrat(g.contrat), theCas=null;
    (c?c.univers:[]).forEach(function(u){ u.cases.forEach(function(k){ if(k.id===g.cas) theCas=k; }); });
    if(!theCas){ errors.push('Événement '+i+', cas non résolu: '+g.contrat+'/'+g.cas); return; }
    if(g.answers){
      Object.keys(g.answers).forEach(function(qid){
        var q = (theCas.quals||[]).filter(function(x){return x.id===qid;})[0];
        if(!q){ errors.push('Événement '+i+', question inconnue: '+qid+' dans '+g.cas); return; }
        if((q.opt||[]).indexOf(g.answers[qid])<0) errors.push('Événement '+i+', réponse hors options: '+qid+'='+g.answers[qid]);
      });
    }
  });

  return {ok:errors.length===0, errors:errors, counts:counts};
}

function showReport(){
  var r = selfTest();
  var el = document.getElementById('report');
  var c = r.counts;
  var head = r.ok
    ? 'Contrôle structurel réussi.'
    : 'Contrôle structurel: '+r.errors.length+' anomalie(s).';
  var stat = c.contrats+' contrats, '+c.univers+' univers, '+c.cas+' cas, '+c.combos+' combinaisons testées, '+c.situations+' situations, '+c.garanties+' garanties.';
  var body = '<div class="report '+(r.ok?'ok':'ko')+'"><strong>'+esc(head)+'</strong><div style="color:#3a4149;margin-top:6px;font-weight:400">'+esc(stat)+'</div>'+
    (r.errors.length?'<ul>'+r.errors.map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ul>':'')+'</div>';
  el.innerHTML = body;
}

/* ============================================================
   INITIALISATION ET ÉVÉNEMENTS
   ============================================================ */
function resetHome(){
  S.step='accueil'; S.mode=null; S.dom=null; S.fromEvent=false; S.contratId=null; S.fam=null; S.casId=null; S.situId=null; S.answers={}; S.qIdx=0;
  render();
}
function init(){
  document.getElementById('footMeta').textContent = BUILD;
  document.getElementById('backBtn').addEventListener('click', back);
  document.getElementById('homeBtn').addEventListener('click', resetHome);
  document.getElementById('selfTestBtn').addEventListener('click', showReport);
  document.getElementById('app').addEventListener('click', function(e){
    var t = e.target.closest('[data-act]');
    if(!t) return;
    var act = t.getAttribute('data-act');
    if(act==='ans'){ return answer(t.getAttribute('data-qid'), t.getAttribute('data-val')); }
    if(act==='gate'){ S.answers._paye = t.getAttribute('data-val'); return render(); }
    if(act==='restart'){ S.answers={}; S.qIdx=0; return render(); }
    if(act==='home'){ return resetHome(); }
    go(act);
  });
  render();
}

var HAS_DOM = (typeof document !== 'undefined');
if(HAS_DOM){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
  else init();
} else if(typeof module !== 'undefined'){
  module.exports = {CONTRATS:CONTRATS, SITUATIONS:SITUATIONS, selfTest:selfTest, allContrats:allContrats};
}
/* Exécution en ligne de commande: lance le contrôle structurel */
if(typeof require!=='undefined' && typeof module!=='undefined' && require.main===module){
  var r = selfTest();
  console.log(JSON.stringify(r, null, 2));
}
